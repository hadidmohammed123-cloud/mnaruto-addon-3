plugins { id 'java'; id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
group = 'com.inmonum.narutomodaddon'
version = mod_version
base { archivesName = 'NarutoModAddon-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: minecraft_version }
repositories { flatDir { dir 'libs' } }
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly files('libs/shinobicraft-api.jar')
}
tasks.named('jar') { finalizedBy 'reobfJar' }
